name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs scarb + starknet-foundry at the versions pinned in .tool-versions.
      - name: Install toolchain (asdf)
        uses: asdf-vm/actions/install@v4

      - name: Check formatting
        run: scarb fmt --check

      - name: Build
        run: scarb build

      - name: Run tests
        run: snforge test
